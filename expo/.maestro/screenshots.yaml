# Automated App Store screenshot capture — navigates the core loop and shoots
# each hero screen. Replaces the manual sim screenshot session.
# Run:  bash scripts/maestro.sh .maestro/screenshots.yaml
# Best run against a RELEASE sim build (no dev chrome). Output: ~/.maestro runs.
appId: social.nox
---
- launchApp:
    clearState: true

# Age gate + sign in (reviewer account is pre-populated: tier, saved events)
- assertVisible: "Age Verification Required"
- tapOn: "Verify Age"
- assertVisible: "Welcome Back"
- tapOn:
    id: "signin-email"
- inputText: "appreview@nox.social"
- tapOn:
    id: "signin-password"
- inputText: "NoxReview2026!"
- hideKeyboard
- tapOn: "Sign In"

# 1 — Discovery / map (hero)
- assertVisible: "Discover Venues"
- takeScreenshot: 01-map

# 2 — Profile (tiers / Prestige / My Night entry)
- tapOn: "Profile"
- assertVisible: "Prestige"
- takeScreenshot: 02-profile

# 3 — My Night (saved events + "at your venues")
- tapOn: "My Night"
- takeScreenshot: 03-my-night
- back

# 4 — Chat / venue communities
- tapOn: "Map"
- tapOn: "Chat"
- takeScreenshot: 04-chat
