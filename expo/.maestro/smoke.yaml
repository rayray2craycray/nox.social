# Nox core-loop smoke test — the critical path that must never break.
# Run:  bash scripts/maestro.sh .maestro/smoke.yaml
#
# Asserts: app launches, age gate + sign-in work, the Map (home tab) loads, and
# the three v1 tabs (Map / Chat / Profile) are reachable without a crash. Would
# have caught the Settings-trap and blank-screen regressions automatically.
appId: social.nox
---
- launchApp:
    clearState: true

# --- Age gate (defaults to a 18+ DOB; just confirm) ---
- assertVisible: "Age Verification Required"
- tapOn:
    text: "Verify Age"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 15000

# --- Sign in with the staged reviewer account ---
- assertVisible: "Welcome Back"
- tapOn:
    id: "signin-email"
- inputText: "appreview@nox.social"
- tapOn:
    id: "signin-password"
- inputText: "NoxReview2026!"
- hideKeyboard
- tapOn: "Sign In"

# --- Map is the home tab and must populate ---
- assertVisible: "Discover Venues"

# --- Every v1 tab reachable, no crash ---
- tapOn: "Chat"
- tapOn: "Profile"
- assertVisible: "Prestige"
- tapOn: "Map"
- assertVisible: "Discover Venues"
