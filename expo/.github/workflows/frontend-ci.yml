# Frontend CI/CD Pipeline for Nox Nightlife App
#
# Status badges:
#   ![Frontend CI](https://github.com/<owner>/nox.social/actions/workflows/frontend-ci.yml/badge.svg)
#
# Required secrets:
#   - EXPO_TOKEN: Expo access token for EAS CLI authentication
#     Generate at https://expo.dev/accounts/<account>/settings/access-tokens

name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'backend/**'
      - '*.md'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'backend/**'
      - '*.md'
      - '.github/workflows/backend-deploy.yml'

env:
  NODE_VERSION: '20'

jobs:
  # ───────────────────────────────────────────────
  # Lint — run ESLint via Expo
  # ───────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Expo lint
        run: npx expo lint

  # ───────────────────────────────────────────────
  # TypeScript — type-check without emitting
  # ───────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  # ───────────────────────────────────────────────
  # Bundle — export to catch import/resolution errors
  # ───────────────────────────────────────────────
  bundle-check:
    name: Bundle Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export iOS bundle
        run: npx expo export --platform ios

  # ───────────────────────────────────────────────
  # Tests — Jest with coverage gate at 50%
  # ───────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: npx jest --coverage --ci

      - name: Coverage gate (50% minimum)
        run: |
          # Parse the JSON coverage summary and enforce 50% threshold
          SUMMARY_FILE="coverage/coverage-summary.json"
          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "::error::Coverage summary not found at $SUMMARY_FILE"
            echo "Ensure Jest is configured with coverageReporters including 'json-summary'."
            exit 1
          fi

          THRESHOLD=50

          LINES=$(node -e "const s = require('./$SUMMARY_FILE'); console.log(s.total.lines.pct)")
          BRANCHES=$(node -e "const s = require('./$SUMMARY_FILE'); console.log(s.total.branches.pct)")
          FUNCTIONS=$(node -e "const s = require('./$SUMMARY_FILE'); console.log(s.total.functions.pct)")
          STATEMENTS=$(node -e "const s = require('./$SUMMARY_FILE'); console.log(s.total.statements.pct)")

          echo "Coverage — Lines: ${LINES}% | Branches: ${BRANCHES}% | Functions: ${FUNCTIONS}% | Statements: ${STATEMENTS}%"

          FAILED=0
          for METRIC in LINES BRANCHES FUNCTIONS STATEMENTS; do
            VALUE=${!METRIC}
            if [ "$(node -e "console.log(${VALUE} < ${THRESHOLD} ? 'fail' : 'pass')")" = "fail" ]; then
              echo "::error::${METRIC} coverage ${VALUE}% is below the ${THRESHOLD}% threshold"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "All coverage metrics meet the ${THRESHOLD}% threshold."

      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false

  # ───────────────────────────────────────────────
  # EAS Build — production iOS build (main branch only)
  # ───────────────────────────────────────────────
  eas-build:
    name: EAS Build (iOS)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, bundle-check, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # EXPO_TOKEN secret must be set in repo Settings > Secrets > Actions
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS production
        run: eas build --platform ios --profile production --non-interactive

  # ───────────────────────────────────────────────
  # EAS Submit — submit latest build to App Store / TestFlight
  # ───────────────────────────────────────────────
  eas-submit:
    name: EAS Submit (iOS)
    runs-on: ubuntu-latest
    needs: [eas-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # EXPO_TOKEN secret must be set in repo Settings > Secrets > Actions
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to App Store
        run: eas submit --platform ios --latest --non-interactive
